<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hvala na porudžbini!</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; font-family: 'Roboto', Arial, sans-serif; background: #f3f6f9; color: #222; }
        .card { max-width: 480px; width: 100%; background: #fff; border-radius: 16px; padding: 40px 28px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        .check { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: #27ae60; color: #fff; font-size: 40px; line-height: 72px; }
        h1 { font-size: 26px; margin: 0 0 12px; }
        p { font-size: 17px; line-height: 1.5; margin: 0 0 12px; color: #444; }
        .order { font-size: 14px; color: #888; margin-top: 20px; }
        .img { max-width: 180px; margin: 10px auto 0; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">&#10003;</div>
        <h1>Hvala na porudžbini!</h1>
        <p>Vaša porudžbina je uspešno primljena.</p>
        <p>Naš operater će Vas uskoro pozvati da potvrdi porudžbinu. Molimo Vas da telefon bude uključen.</p>
        <img class="img" src="img/prod-main.png" alt="Osteon">
        <p class="order" id="order"></p>
    </div>
    <script>
        var id = new URLSearchParams(window.location.search).get('id');
        if (id) document.getElementById('order').textContent = 'Broj porudžbine: ' + id;
    </script>
</body>
</html>
